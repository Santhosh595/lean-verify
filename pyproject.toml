[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-verify"
version = "0.1.0"
description = "Lean 4 proof-verification harness CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Stdlib-only by design (README: "No new external dependencies beyond Python
# stdlib"). Do not add runtime dependencies here without changing that claim.
dependencies = []

[project.scripts]
lean-verify = "lean_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
